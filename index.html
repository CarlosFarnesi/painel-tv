<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Sala</title>
<meta name="description" content="Fotos da família, relógio, clima de Campinas e atalhos dos apps para a TV da sala.">
<script src="config.js"></script>
<style>
  :root {
    --text: #ffffff;
    --muted: rgba(255,255,255,0.72);
    --glass: rgba(10,16,30,0.55);
    --glass-border: rgba(255,255,255,0.16);
    --accent: #ffd27a;
    --rain: #8fd0ff;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a1020; color: var(--text);
    font-family: "SamsungOneUI", "SamsungOne", "Samsung Sans", "Inter", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; cursor: none;
  }

  /* ---------- Fundo: fotos em camadas compostas pela GPU (sem filtros) ---------- */
  .no-photos { position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    background: radial-gradient(120vw 90vh at 85% -10%, #1f5aa8 0%, #15356b 40%, #0b1730 100%); }
  .bg { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  .slot { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0;
    -webkit-transition: opacity 1.2s linear; transition: opacity 1.2s linear; }
  .slot.show { opacity: 1; }
  .slot img { position: absolute; left: 0; top: 0; display: block;
    -webkit-backface-visibility: hidden; backface-visibility: hidden;
    -webkit-transform: translate3d(0,0,0); transform: translate3d(0,0,0);
    -webkit-transform-origin: 50% 50%; transform-origin: 50% 50%;
    -webkit-transition-property: -webkit-transform; transition-property: transform;
    -webkit-transition-timing-function: linear; transition-timing-function: linear; }
  .shade-top { position: fixed; left: 0; top: 0; width: 100%; height: 44vh;
    background: -webkit-linear-gradient(top, rgba(0,0,0,0.66), rgba(0,0,0,0));
    background: linear-gradient(to bottom, rgba(0,0,0,0.66), rgba(0,0,0,0)); }
  .shade-bottom { position: fixed; left: 0; bottom: 0; width: 100%; height: 42vh;
    background: -webkit-linear-gradient(bottom, rgba(0,0,0,0.82), rgba(0,0,0,0));
    background: linear-gradient(to top, rgba(0,0,0,0.82), rgba(0,0,0,0)); }

  /* ---------- Conteúdo ---------- */
  .ui { position: relative; z-index: 2; box-sizing: border-box; height: 100vh;
    padding: 4.5vh 4.5vw 4vh 4.5vw; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .greeting { font-size: 3.4vh; font-weight: 500; margin: 0 0 0.6vh 0; }
  .clock { font-size: 15vh; line-height: 0.95; font-weight: 300; letter-spacing: -0.03em; margin: 0; }
  .date { font-size: 3.1vh; font-weight: 400; margin: 1vh 0 0 0; }
  .date::first-letter { text-transform: uppercase; }

  .now { text-align: right; background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 2.4vh; padding: 2vh 2vw 2vh 2vw; min-width: 22vw; }
  .now .place { font-size: 2vh; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.6vh 0; }
  .now .main { display: flex; align-items: center; justify-content: flex-end; }
  .now .icon { width: 11vh; height: 11vh; margin-right: 1vw; }
  .now .icon svg { width: 100%; height: 100%; }
  .now .temp { font-size: 11vh; line-height: 1; font-weight: 300; letter-spacing: -0.04em; }
  .now .temp sup { font-size: 4vh; font-weight: 300; vertical-align: top; margin-left: 0.2vw; color: var(--accent); }
  .now .desc { font-size: 2.8vh; font-weight: 500; margin: 0.6vh 0 0 0; }
  .now .meta { font-size: 2.2vh; color: var(--muted); margin: 0.6vh 0 0 0; }
  .now .meta b { color: var(--text); font-weight: 600; }
  .now .meta .r { color: var(--rain); font-weight: 600; }
  .now .grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); grid-column-gap: 0.8vw; margin-top: 1.6vh;
    padding-top: 1.4vh; border-top: 1px solid var(--glass-border); text-align: center; }
  .now .grid .k { font-size: 1.6vh; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .now .grid .v { font-size: 2.6vh; font-weight: 600; margin: 0.3vh 0 0 0; white-space: nowrap; }
  .now .grid .v small { font-size: 1.7vh; color: var(--muted); font-weight: 400; }
  .now .days { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); grid-column-gap: 0.8vw; margin-top: 1.4vh;
    padding-top: 1.4vh; border-top: 1px solid var(--glass-border); text-align: center; }
  .now .days .n { font-size: 1.7vh; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .now .days .i { width: 4.2vh; height: 4.2vh; margin: 0.3vh auto 0 auto; }
  .now .days .i svg { width: 100%; height: 100%; }
  .now .days .t { font-size: 2.2vh; font-weight: 600; margin: 0.2vh 0 0 0; white-space: nowrap; }
  .now .days .t small { color: var(--muted); font-weight: 400; }
  .now .days .p { font-size: 1.6vh; color: var(--rain); margin: 0.2vh 0 0 0; font-weight: 500; }
  .now .sun { font-size: 1.7vh; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 1.2vh 0 0 0; text-align: center; }

  /* ---------- Apps ---------- */
  .apps-title { font-size: 2vh; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 1.4vh 0.4vw; font-weight: 500; }
  .apps { display: flex; align-items: stretch; }
  .app { position: relative; flex: 1 1 0; height: 15.5vh; margin-right: 1vw; border-radius: 1.6vh;
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    font-size: 3.4vh; font-weight: 700; background: #1b2030;
    border: 0.45vh solid rgba(255,255,255,0);
    -webkit-transform: translate3d(0,0,0) scale(1); transform: translate3d(0,0,0) scale(1);
    -webkit-transition: -webkit-transform 0.15s ease, border-color 0.15s ease; transition: transform 0.15s ease, border-color 0.15s ease; }
  .app:last-child { margin-right: 0; }
  .app img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: none; }
  .app.has-icon img { display: block; }
  .app.has-icon .label { display: none; }
  .app .label { position: relative; z-index: 1; }
  .app.focus { -webkit-transform: translate3d(0,0,0) scale(1.07); transform: translate3d(0,0,0) scale(1.07); border-color: #ffffff; z-index: 3; }
  .hint { font-size: 1.9vh; color: var(--muted); margin: 1.6vh 0 0 0.4vw; letter-spacing: 0.06em; }

  .toast { position: fixed; left: 50%; top: 50%; z-index: 9; -webkit-transform: translate(-50%,-50%); transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.82); border: 1px solid var(--glass-border); border-radius: 2vh; padding: 2.4vh 3vw;
    font-size: 3vh; font-weight: 500; display: none; }
  .toast.show { display: block; }

  @media (max-width: 900px) {
    .ui { padding: 3vh 4vw; }
    .clock { font-size: 11vh; }
    .now { min-width: 0; padding: 1.5vh 3vw; }
    .now .temp { font-size: 8vh; } .now .icon { width: 8vh; height: 8vh; }
    .now .grid, .now .days { display: none; }
    .app { height: 11vh; font-size: 2.4vh; }
  }
</style>
</head>
<body>

<div class="no-photos" id="no-photos"></div>
<div class="bg">
  <div class="slot" id="slot-a"><img alt=""></div>
  <div class="slot" id="slot-b"><img alt=""></div>
</div>
<div class="shade-top"></div>
<div class="shade-bottom"></div>

<div class="ui">
  <div class="top">
    <div>
      <p class="greeting" id="greeting">Boa noite</p>
      <p class="clock" id="hm">--:--</p>
      <p class="date" id="date">carregando a data…</p>
    </div>
    <div class="now">
      <p class="place">Campinas · SP</p>
      <div class="main">
        <div class="icon" id="now-icon"></div>
        <div class="temp"><span id="now-temp">--</span><sup>°C</sup></div>
      </div>
      <p class="desc" id="now-desc">Buscando previsão…</p>
      <p class="meta" id="now-meta"></p>
      <div class="grid" id="now-grid"></div>
      <div class="days" id="now-days"></div>
      <p class="sun" id="now-sun"></p>
    </div>
  </div>

  <div>
    <p class="apps-title">Seus apps</p>
    <div class="apps" id="apps"></div>
    <p class="hint">Setas para escolher · OK para abrir · Voltar para sair</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ---------- Configuração (config.js e/ou #album=...&apps=...&proxy=...) ---------- */
  var CFG = window.PAINEL_CONFIG || {};
  (function () {
    var h = location.hash.replace(/^#/, ""); if (!h) return;
    var parts = h.split("&");
    for (var i = 0; i < parts.length; i++) { var kv = parts[i].split("="); if (kv.length === 2) CFG[kv[0]] = decodeURIComponent(kv[1]); }
  })();
  var ALBUM_TOKEN = CFG.album || "", ALBUM_PROXY = CFG.proxy || "";
  var PHOTO_SECONDS = Math.max(15, parseInt(CFG.seconds || "60", 10));
  var NOME = CFG.nome || "família Farnesi";

  var CATALOG = {
    netflix: { name: "Netflix", id: "org.tizen.netflix-app", bg: "#e50914" },
    youtube: { name: "YouTube", id: "9Ur5IzDKqV.TizenYouTube", bg: "#cc0000" },
    prime:   { name: "Prime Video", id: "evKhCgZelL.AmazonIgnitionLauncher2", bg: "#00a8e1" },
    disney:  { name: "Disney+", id: "MCmYXNxgcu.DisneyPlus", bg: "#113ccf" },
    spotify: { name: "Spotify", id: "rJeHak5zRg.Spotify", bg: "#1db954" },
    appletv: { name: "Apple TV", id: "com.samsung.tv.aria-video", bg: "#2c2c2e" },
    tvplus:  { name: "TV Plus", id: "com.samsung.tv.tvPlusDeeplinker", bg: "#5b2fd6" }
  };
  var APP_KEYS = (CFG.apps || "netflix,youtube,prime,disney,appletv").split(",");

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  var r = function (n) { return Math.round(n); };
  var IS_TV = !!(window.tizen && window.tizen.application);

  /* ---------- Relógio (mexe no DOM só quando o minuto muda) ---------- */
  var DIAS = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
  var MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  var lastMin = -1;
  function tick() {
    var d = new Date(), m = d.getHours() * 60 + d.getMinutes();
    if (m === lastMin) return; lastMin = m;
    $("hm").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    $("date").textContent = DIAS[d.getDay()] + ", " + d.getDate() + " de " + MESES[d.getMonth()] + " de " + d.getFullYear();
    var h = d.getHours();
    $("greeting").textContent = (h < 5 ? "Boa madrugada" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite") + ", " + NOME;
    if (h === 4 && d.getMinutes() === 0) location.reload();
  }
  tick(); setInterval(tick, 1000);

  /* ---------- Ícones do clima ---------- */
  var S = 'xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  var SUN = '<circle cx="32" cy="32" r="11" fill="#ffd27a"/><g stroke="#ffd27a" stroke-width="3"><path d="M32 8v6M32 50v6M8 32h6M50 32h6M15 15l4 4M45 45l4 4M15 49l4-4M45 19l4-4"/></g>';
  var MOON = '<path d="M40 10a20 20 0 1 0 14 30 16 16 0 0 1-14-30z" fill="#eef2fa"/>';
  var CLOUD = '<path d="M20 48h26a10 10 0 0 0 1-20 14 14 0 0 0-27-3 11 11 0 0 0 0 23z" fill="#dfe7f5"/>';
  var CLOUD_DARK = '<path d="M20 48h26a10 10 0 0 0 1-20 14 14 0 0 0-27-3 11 11 0 0 0 0 23z" fill="#aab8d3"/>';
  var SMALL_SUN = '<circle cx="42" cy="20" r="8" fill="#ffd27a"/><g stroke="#ffd27a" stroke-width="2.5"><path d="M42 5v4M42 31v4M27 20h4M53 20h4M31 9l3 3M50 28l3 3M31 31l3-3M50 12l3-3"/></g>';
  var SMALL_MOON = '<path d="M46 8a11 11 0 1 0 8 17 9 9 0 0 1-8-17z" fill="#eef2fa"/>';
  var CLOUD_LOW = '<path d="M18 50h28a9 9 0 0 0 1-18 13 13 0 0 0-25-3 10 10 0 0 0-4 21z" fill="#dfe7f5"/>';
  var RAIN = '<g stroke="#8fd0ff" stroke-width="3"><path d="M24 52v6M32 54v6M40 52v6"/></g>';
  var HEAVY = '<g stroke="#8fd0ff" stroke-width="3"><path d="M20 52v7M28 54v7M36 52v7M44 54v7"/></g>';
  var DRIZZLE = '<g stroke="#8fd0ff" stroke-width="3"><path d="M24 54v1M32 56v1M40 54v1M28 60v1M36 60v1"/></g>';
  var BOLT = '<path d="M34 46l-6 10h6l-3 8 9-12h-6l3-6z" fill="#ffd27a"/>';
  var FOG = '<g stroke="#dfe7f5" stroke-width="3"><path d="M14 52h36M18 58h28"/></g>';
  function icon(code, isDay) {
    var b;
    if (code === 0) b = isDay ? SUN : MOON;
    else if (code === 1 || code === 2) b = (isDay ? SMALL_SUN : SMALL_MOON) + CLOUD_LOW;
    else if (code === 3) b = CLOUD;
    else if (code === 45 || code === 48) b = CLOUD_LOW + FOG;
    else if (code >= 51 && code <= 57) b = CLOUD_LOW + DRIZZLE;
    else if (code === 61 || code === 80 || code === 66) b = CLOUD_LOW + RAIN;
    else if (code === 63 || code === 81 || code === 67) b = CLOUD_DARK + RAIN;
    else if (code === 65 || code === 82) b = CLOUD_DARK + HEAVY;
    else if (code >= 95) b = CLOUD_DARK + BOLT;
    else b = CLOUD;
    return '<svg ' + S + '>' + b + '</svg>';
  }
  function describe(c) {
    if (c === 0) return "Céu limpo"; if (c === 1) return "Predominantemente limpo"; if (c === 2) return "Parcialmente nublado";
    if (c === 3) return "Nublado"; if (c === 45 || c === 48) return "Nevoeiro"; if (c >= 51 && c <= 57) return "Garoa";
    if (c === 61) return "Chuva fraca"; if (c === 63) return "Chuva moderada"; if (c === 65) return "Chuva forte";
    if (c === 66 || c === 67) return "Chuva gelada"; if (c >= 71 && c <= 77) return "Neve"; if (c === 80) return "Pancadas fracas";
    if (c === 81) return "Pancadas de chuva"; if (c === 82) return "Pancadas fortes"; if (c === 95) return "Trovoadas";
    if (c === 96 || c === 99) return "Trovoadas com granizo"; return "Sem dados";
  }

  /* ---------- Rede ---------- */
  function xhrJSON(method, url, body, headers, cb) {
    var x = new XMLHttpRequest();
    x.open(method, url, true); x.timeout = 25000;
    if (headers) for (var k in headers) x.setRequestHeader(k, headers[k]);
    x.onload = function () { try { cb(null, x.status, JSON.parse(x.responseText)); } catch (e) { cb(e, x.status, null); } };
    x.onerror = function () { cb(new Error("rede"), 0, null); };
    x.ontimeout = function () { cb(new Error("timeout"), 0, null); };
    x.send(body || null);
  }

  /* ---------- Clima ---------- */
  var API = "https://api.open-meteo.com/v1/forecast?latitude=-22.9056&longitude=-47.0608"
    + "&current=temperature_2m,apparent_temperature,relative_humidity_2m,wind_speed_10m,is_day,weather_code"
    + "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset"
    + "&timezone=America%2FSao_Paulo&forecast_days=4";
  function loadWeather() {
    xhrJSON("GET", API + "&_=" + Date.now(), null, null, function (err, st, d) {
      if (err || st !== 200 || !d) { setTimeout(loadWeather, 2 * 60 * 1000); return; }
      var cur = d.current, dy = d.daily, isDay = cur.is_day === 1;
      $("now-icon").innerHTML = icon(cur.weather_code, isDay);
      $("now-temp").textContent = r(cur.temperature_2m);
      $("now-desc").textContent = describe(cur.weather_code);
      var pp = dy.precipitation_probability_max[0];
      $("now-meta").innerHTML = "Máx <b>" + r(dy.temperature_2m_max[0]) + "°</b> · Mín <b>" + r(dy.temperature_2m_min[0]) + "°</b>"
        + (pp != null ? " · <span class='r'>Chuva " + pp + "%</span>" : "");
      var uv = dy.uv_index_max[0], uvTxt = uv == null ? "--" : (uv < 3 ? "baixo" : uv < 6 ? "moderado" : uv < 8 ? "alto" : uv < 11 ? "muito alto" : "extremo");
      $("now-grid").innerHTML =
          '<div><p class="k">Sensação</p><p class="v">' + r(cur.apparent_temperature) + '<small>°C</small></p></div>'
        + '<div><p class="k">Umidade</p><p class="v">' + cur.relative_humidity_2m + '<small>%</small></p></div>'
        + '<div><p class="k">Vento</p><p class="v">' + r(cur.wind_speed_10m) + '<small> km/h</small></p></div>'
        + '<div><p class="k">UV</p><p class="v">' + (uv == null ? "--" : r(uv)) + '<small> ' + uvTxt + '</small></p></div>';
      var DC = ["dom","seg","ter","qua","qui","sex","sáb"], html = "";
      for (var j = 1; j < dy.time.length && j <= 3; j++) {
        var q = dy.time[j].split("-"), dd = new Date(parseInt(q[0],10), parseInt(q[1],10)-1, parseInt(q[2],10));
        var pj = dy.precipitation_probability_max[j];
        html += '<div><p class="n">' + (j === 1 ? "Amanhã" : DC[dd.getDay()]) + '</p><div class="i">' + icon(dy.weather_code[j], true) + '</div>'
          + '<p class="t">' + r(dy.temperature_2m_max[j]) + '° <small>' + r(dy.temperature_2m_min[j]) + '°</small></p>'
          + '<p class="p">' + (pj != null && pj > 0 ? pj + "% chuva" : "&nbsp;") + '</p></div>';
      }
      $("now-days").innerHTML = html;
      $("now-sun").innerHTML = "Sol " + dy.sunrise[0].substr(11,5) + " ↑ &nbsp; " + dy.sunset[0].substr(11,5) + " ↓";
    });
  }
  loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);

  /* ---------- Fotos do iCloud ---------- */
  var photos = [], photoIdx = 0, showingA = false, photoTimer = null, preloaded = null;
  function b62(s) { var A = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz", n = 0; for (var i = 0; i < s.length; i++) n = n * 62 + A.indexOf(s.charAt(i)); return n; }
  function partitionHost(t) { var n = t.charAt(0) === "A" ? b62(t.charAt(1)) : b62(t.substring(1, 3)); return "p" + (n < 10 ? "0" + n : n) + "-sharedstreams.icloud.com"; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  /* escolhe a derivada mais leve que ainda preencha a tela (evita decodificar imagem gigante) */
  function pickDerivative(ders) {
    var want = Math.max(window.innerWidth, 1280), best = null, bestW = 0, smallestOk = null, smallestOkW = 1e9;
    for (var k in ders) {
      var w = parseInt(ders[k].width, 10) || 0;
      if (w > bestW) { bestW = w; best = k; }
      if (w >= want && w < smallestOkW) { smallestOkW = w; smallestOk = k; }
    }
    return smallestOk || best;
  }
  function loadAlbum() {
    if (!ALBUM_TOKEN && !ALBUM_PROXY) return;
    if (ALBUM_PROXY) {
      xhrJSON("GET", ALBUM_PROXY + (ALBUM_PROXY.indexOf("?") < 0 ? "?" : "&") + "token=" + encodeURIComponent(ALBUM_TOKEN) + "&_=" + Date.now(), null, null, function (err, st, d) {
        if (!err && st === 200 && d && d.urls) gotPhotos(d.urls); else setTimeout(loadAlbum, 2 * 60 * 1000);
      });
      return;
    }
    function stream(h, tries) {
      xhrJSON("POST", "https://" + h + "/" + ALBUM_TOKEN + "/sharedstreams/webstream", '{"streamCtag":null}', { "Content-Type": "text/plain" }, function (err, st, d) {
        if (st === 330 && d && d["X-Apple-MMe-Host"] && tries < 2) { stream(d["X-Apple-MMe-Host"], tries + 1); return; }
        if (err || st !== 200 || !d || !d.photos) { setTimeout(loadAlbum, 2 * 60 * 1000); return; }
        var guids = [], best = {};
        for (var i = 0; i < d.photos.length; i++) {
          var p = d.photos[i]; if (p.mediaAssetType === "video" || !p.derivatives) continue;
          var k = pickDerivative(p.derivatives); if (!k) continue;
          best[p.derivatives[k].checksum] = { w: parseInt(p.derivatives[k].width, 10) || 0, h: parseInt(p.derivatives[k].height, 10) || 0 };
          guids.push(p.photoGuid);
        }
        xhrJSON("POST", "https://" + h + "/" + ALBUM_TOKEN + "/sharedstreams/webasseturls", JSON.stringify({ photoGuids: guids }), { "Content-Type": "text/plain" }, function (err2, st2, u) {
          if (err2 || st2 !== 200 || !u || !u.items) { setTimeout(loadAlbum, 2 * 60 * 1000); return; }
          var urls = [];
          for (var cs in best) { var it = u.items[cs]; if (it) urls.push({ url: "https://" + it.url_location + it.url_path, w: best[cs].w, h: best[cs].h }); }
          gotPhotos(urls);
        });
      });
    }
    stream(partitionHost(ALBUM_TOKEN), 0);
  }
  function gotPhotos(urls) {
    if (!urls.length) return;
    photos = shuffle(urls.slice()); photoIdx = 0; preloaded = null;
    preload(function () { showNext(); });
    if (photoTimer) clearInterval(photoTimer);
    photoTimer = setInterval(showNext, PHOTO_SECONDS * 1000);
  }
  /* carrega a próxima foto em memória antes da hora de trocar */
  function preload(cb) {
    if (!photos.length) return;
    var p = photos[photoIdx % photos.length];
    var im = new Image();
    im.onload = function () { preloaded = { img: im, p: p }; if (cb) cb(); };
    im.onerror = function () { photoIdx++; preloaded = null; setTimeout(function () { preload(cb); }, 1000); };
    im.src = p.url;
  }
  function showNext() {
    if (!preloaded) { preload(function () { showNext(); }); return; }
    var im = preloaded.img; preloaded = null; photoIdx++;
    var vw = window.innerWidth, vh = window.innerHeight;
    var scale = Math.max(vw / im.width, vh / im.height);
    var w = Math.ceil(im.width * scale), h = Math.ceil(im.height * scale);
    var slot = $(showingA ? "slot-b" : "slot-a"), other = $(showingA ? "slot-a" : "slot-b");
    var el = slot.children[0];
    /* posiciona sem animação */
    el.style.transitionDuration = "0s"; el.style.webkitTransitionDuration = "0s";
    el.style.width = w + "px"; el.style.height = h + "px";
    el.style.left = Math.round((vw - w) / 2) + "px"; el.style.top = "0px";
    el.style.webkitTransform = "translate3d(0,0,0) scale(1)"; el.style.transform = "translate3d(0,0,0) scale(1)";
    el.src = im.src;
    slot.className = "slot show"; other.className = "slot";
    showingA = !showingA;
    /* anima pela GPU: foto em pé desliza até o fim; deitada faz um zoom lento */
    var portrait = h > vh + 4, dur = (PHOTO_SECONDS + 1.5) + "s";
    setTimeout(function () {
      el.style.transitionDuration = dur; el.style.webkitTransitionDuration = dur;
      var t = portrait ? "translate3d(0," + (vh - h) + "px,0) scale(1)" : "translate3d(0,0,0) scale(1.06)";
      el.style.webkitTransform = t; el.style.transform = t;
    }, 60);
    $("no-photos").style.display = "none";
    setTimeout(function () { preload(null); }, 1500);
  }
  loadAlbum();
  setInterval(loadAlbum, 6 * 60 * 60 * 1000);

  /* ---------- Apps ---------- */
  var focus = 0, cards = [];
  function buildApps() {
    var html = "";
    for (var i = 0; i < APP_KEYS.length; i++) {
      var a = CATALOG[APP_KEYS[i]]; if (!a) continue;
      html += '<div class="app" data-key="' + APP_KEYS[i] + '" style="background:' + a.bg + '"><img alt=""><span class="label">' + a.name + '</span></div>';
    }
    $("apps").innerHTML = html;
    cards = $("apps").children;
    for (var j = 0; j < cards.length; j++) (function (idx) {
      var card = cards[idx], a = CATALOG[card.getAttribute("data-key")];
      card.onclick = function () { setFocus(idx); launch(); };
      /* ícone oficial: o que a própria TV guarda para o app instalado */
      if (IS_TV) {
        try {
          var info = tizen.application.getAppInfo(a.id);
          if (info && info.iconPath) {
            var im = card.children[0];
            im.onload = function () { card.className += " has-icon"; };
            im.src = (info.iconPath.indexOf("file://") === 0 ? "" : "file://") + info.iconPath;
          }
        } catch (e) {}
      }
    })(j);
    setFocus(0);
  }
  function setFocus(i) {
    if (!cards.length) return;
    focus = (i + cards.length) % cards.length;
    for (var k = 0; k < cards.length; k++) {
      var c = cards[k], has = c.className.indexOf("has-icon") >= 0;
      c.className = "app" + (has ? " has-icon" : "") + (k === focus ? " focus" : "");
    }
  }
  function toast(msg, ms) { var t = $("toast"); t.textContent = msg; t.className = "toast show"; setTimeout(function () { t.className = "toast"; }, ms || 1800); }
  function launch() {
    var a = CATALOG[cards[focus].getAttribute("data-key")];
    if (IS_TV) {
      toast("Abrindo " + a.name + "…", 4000);
      try {
        tizen.application.launch(a.id, function () {}, function () {
          try { tizen.application.launchAppControl(new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/view"), a.id, null, function () { toast("Não consegui abrir " + a.name); }); }
          catch (e2) { toast("Não consegui abrir " + a.name); }
        });
      } catch (e) { toast("Não consegui abrir " + a.name); }
    } else {
      toast("Na TV isto abriria o " + a.name);
    }
  }
  buildApps();

  document.addEventListener("keydown", function (ev) {
    var k = ev.keyCode;
    if (k === 37) { setFocus(focus - 1); ev.preventDefault(); }
    else if (k === 39) { setFocus(focus + 1); ev.preventDefault(); }
    else if (k === 13) { launch(); ev.preventDefault(); }
    else if (k === 32) { showNext(); }
    else if (k === 10009 || k === 27) { try { tizen.application.getCurrentApplication().exit(); } catch (e) {} }
  });
  try { if (window.tizen && tizen.power) tizen.power.request("SCREEN", "SCREEN_NORMAL"); } catch (e) {}
})();
</script>
</body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel da Sala</title>
<meta name="description" content="Fotos da família, relógio, clima de Campinas e atalhos dos apps para a TV da sala.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
  :root {
    --text: #ffffff;
    --muted: rgba(255,255,255,0.72);
    --glass: rgba(10,16,30,0.42);
    --glass-border: rgba(255,255,255,0.16);
    --accent: #ffd27a;
    --rain: #8fd0ff;
  }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0a1020; color: var(--text);
    font-family: "Inter", "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif;
    overflow: hidden; cursor: none; -webkit-font-smoothing: antialiased;
  }

  /* ---------- Fundo com fotos ---------- */
  .bg { position: fixed; left: 0; top: 0; width: 100%; height: 100%; overflow: hidden; }
  .slot { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0; transition: opacity 1.6s ease; }
  .slot.show { opacity: 1; }
  .slot .blur {
    position: absolute; left: -6%; top: -6%; width: 112%; height: 112%;
    background-size: cover; background-position: center;
    -webkit-filter: blur(28px) brightness(0.55); filter: blur(28px) brightness(0.55);
  }
  .slot .pic {
    position: absolute; left: 0; top: 0; width: 100%; height: 100%;
    background-size: cover; background-repeat: no-repeat; background-position: center 0%;
  }
  /* foto em pé: começa pelo topo (rostos) e desliza até o pé da foto durante a exposição */
  .slot.pan .pic { -webkit-transition: background-position linear; transition: background-position linear; }
  .slot.pan.go .pic { background-position: center 100%; }
  /* foto deitada: zoom bem lento para dar vida */
  .slot.zoom .pic { -webkit-transform: scale(1); transform: scale(1); -webkit-transition: -webkit-transform linear; transition: transform linear; }
  .slot.zoom.go .pic { -webkit-transform: scale(1.08); transform: scale(1.08); }
  .shade-top { position: fixed; left: 0; top: 0; width: 100%; height: 42vh;
    background: -webkit-linear-gradient(top, rgba(0,0,0,0.62), rgba(0,0,0,0));
    background: linear-gradient(to bottom, rgba(0,0,0,0.62), rgba(0,0,0,0)); }
  .shade-bottom { position: fixed; left: 0; bottom: 0; width: 100%; height: 40vh;
    background: -webkit-linear-gradient(bottom, rgba(0,0,0,0.78), rgba(0,0,0,0));
    background: linear-gradient(to top, rgba(0,0,0,0.78), rgba(0,0,0,0)); }
  .no-photos { position: fixed; left: 0; top: 0; width: 100%; height: 100%;
    background: radial-gradient(120vw 90vh at 85% -10%, #1f5aa8 0%, #15356b 40%, #0b1730 100%); }

  /* ---------- Camada de conteúdo ---------- */
  .ui { position: relative; z-index: 2; box-sizing: border-box; height: 100vh;
    padding: 4.5vh 4.5vw 4vh 4.5vw; display: flex; flex-direction: column; justify-content: space-between; }
  .text-shadow { text-shadow: 0 0.3vh 1.6vh rgba(0,0,0,0.55); }

  .top { display: flex; justify-content: space-between; align-items: flex-start; }
  .greeting { font-size: 2.3vh; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.8vh 0; }
  .clock { font-size: 15vh; line-height: 0.95; font-weight: 300; letter-spacing: -0.03em; margin: 0; font-variant-numeric: tabular-nums; }
  .clock .sec { font-size: 3.6vh; font-weight: 400; color: var(--muted); margin-left: 0.8vw; letter-spacing: 0; }
  .date { font-size: 3.1vh; font-weight: 400; margin: 1vh 0 0 0; }
  .date::first-letter { text-transform: uppercase; }

  .now { text-align: right; background: var(--glass); border: 1px solid var(--glass-border);
    border-radius: 2.4vh; padding: 2vh 2vw 2vh 2vw; min-width: 22vw; }
  .now .place { font-size: 2vh; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.6vh 0; }
  .now .main { display: flex; align-items: center; justify-content: flex-end; }
  .now .icon { width: 11vh; height: 11vh; margin-right: 1vw; }
  .now .icon svg { width: 100%; height: 100%; }
  .now .temp { font-size: 11vh; line-height: 1; font-weight: 300; letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
  .now .temp sup { font-size: 4vh; font-weight: 300; vertical-align: top; margin-left: 0.2vw; color: var(--accent); }
  .now .desc { font-size: 2.8vh; font-weight: 500; margin: 0.6vh 0 0 0; }
  .now .meta { font-size: 2.2vh; color: var(--muted); margin: 0.6vh 0 0 0; }
  .now .meta b { color: var(--text); font-weight: 600; }
  .now .meta .r { color: var(--rain); font-weight: 600; }

  /* ---------- Apps ---------- */
  .apps-wrap { }
  .apps-title { font-size: 2vh; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 1.4vh 0.4vw; font-weight: 500; }
  .apps { display: flex; align-items: stretch; }
  .app {
    position: relative; flex: 1 1 0; height: 15.5vh; margin-right: 1vw; border-radius: 2vh;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.4vh; font-weight: 700; letter-spacing: -0.01em;
    border: 0.45vh solid rgba(255,255,255,0);
    box-shadow: 0 1vh 3vh rgba(0,0,0,0.45);
    -webkit-transition: -webkit-transform 0.18s ease, border-color 0.18s ease; transition: transform 0.18s ease, border-color 0.18s ease;
    overflow: hidden;
  }
  .app:last-child { margin-right: 0; }
  .app .glyph { position: absolute; right: -1vw; bottom: -4vh; font-size: 20vh; font-weight: 800; opacity: 0.14; letter-spacing: -0.06em; }
  .app .label { position: relative; z-index: 1; text-shadow: 0 0.2vh 0.8vh rgba(0,0,0,0.35); }
  .app.focus { -webkit-transform: scale(1.07); transform: scale(1.07); border-color: #ffffff; z-index: 3; }
  .hint { font-size: 1.9vh; color: var(--muted); margin: 1.6vh 0 0 0.4vw; letter-spacing: 0.06em; }

  .toast { position: fixed; left: 50%; top: 50%; z-index: 9; -webkit-transform: translate(-50%,-50%); transform: translate(-50%,-50%);
    background: rgba(0,0,0,0.78); border: 1px solid var(--glass-border); border-radius: 2vh; padding: 2.4vh 3vw;
    font-size: 3vh; font-weight: 500; display: none; }
  .toast.show { display: block; }

  @media (max-width: 900px) {
    .ui { padding: 3vh 4vw; }
    .clock { font-size: 11vh; }
    .now { min-width: 0; padding: 1.5vh 3vw; }
    .now .temp { font-size: 8vh; } .now .icon { width: 8vh; height: 8vh; }
    .app { height: 11vh; font-size: 2.4vh; }
  }
</style>
</head>
<body>

<div class="no-photos" id="no-photos"></div>
<div class="bg">
  <div class="slot" id="slot-a"><div class="blur"></div><div class="pic"></div></div>
  <div class="slot" id="slot-b"><div class="blur"></div><div class="pic"></div></div>
</div>
<div class="shade-top"></div>
<div class="shade-bottom"></div>

<div class="ui">
  <div class="top">
    <div class="text-shadow">
      <p class="greeting" id="greeting">Boa noite</p>
      <p class="clock"><span id="hm">--:--</span><span class="sec" id="ss"></span></p>
      <p class="date" id="date">carregando a data…</p>
    </div>
    <div class="now">
      <p class="place">Campinas · SP</p>
      <div class="main">
        <div class="icon" id="now-icon"></div>
        <div class="temp"><span id="now-temp">--</span><sup>°C</sup></div>
      </div>
      <p class="desc" id="now-desc">Buscando previsão…</p>
      <p class="meta" id="now-meta"></p>
    </div>
  </div>

  <div class="apps-wrap">
    <p class="apps-title text-shadow">Seus apps</p>
    <div class="apps" id="apps"></div>
    <p class="hint text-shadow" id="hint">Setas para escolher · OK para abrir · Voltar para sair</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  /* ---------- Configuração (config.js e/ou #album=...&apps=...&proxy=...) ---------- */
  var CFG = window.PAINEL_CONFIG || {};
  (function parseHash() {
    var h = location.hash.replace(/^#/, "");
    if (!h) return;
    var parts = h.split("&");
    for (var i = 0; i < parts.length; i++) {
      var kv = parts[i].split("=");
      if (kv.length === 2) CFG[kv[0]] = decodeURIComponent(kv[1]);
    }
  })();
  var ALBUM_TOKEN = CFG.album || "";
  var ALBUM_PROXY = CFG.proxy || "";
  var PHOTO_SECONDS = parseInt(CFG.seconds || "60", 10);
  var COVER = String(CFG.cover || "") === "1";

  var CATALOG = {
    netflix: { name: "Netflix", id: "org.tizen.netflix-app", bg: "linear-gradient(135deg,#b20710,#e50914)", glyph: "N" },
    youtube: { name: "YouTube", id: "9Ur5IzDKqV.TizenYouTube", bg: "linear-gradient(135deg,#c4302b,#ff0000)", glyph: "▶" },
    prime:   { name: "Prime Video", id: "evKhCgZelL.AmazonIgnitionLauncher2", bg: "linear-gradient(135deg,#0f79af,#00a8e1)", glyph: "p" },
    disney:  { name: "Disney+", id: "MCmYXNxgcu.DisneyPlus", bg: "linear-gradient(135deg,#0b1e63,#113ccf)", glyph: "D+" },
    spotify: { name: "Spotify", id: "rJeHak5zRg.Spotify", bg: "linear-gradient(135deg,#128a3e,#1db954)", glyph: "♫" },
    appletv: { name: "Apple TV", id: "com.samsung.tv.aria-video", bg: "linear-gradient(135deg,#1c1c1e,#3a3a3c)", glyph: "tv" },
    tvplus:  { name: "TV Plus", id: "com.samsung.tv.tvPlusDeeplinker", bg: "linear-gradient(135deg,#3b1c9e,#5b2fd6)", glyph: "+" }
  };
  var APP_KEYS = (CFG.apps || "netflix,youtube,prime,disney,spotify,appletv").split(",");

  var $ = function (id) { return document.getElementById(id); };
  var pad = function (n) { return (n < 10 ? "0" : "") + n; };
  var r = function (n) { return Math.round(n); };

  /* ---------- Relógio ---------- */
  var DIAS = ["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
  var MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
  function tick() {
    var d = new Date();
    $("hm").textContent = pad(d.getHours()) + ":" + pad(d.getMinutes());
    $("ss").textContent = pad(d.getSeconds());
    $("date").textContent = DIAS[d.getDay()] + ", " + d.getDate() + " de " + MESES[d.getMonth()] + " de " + d.getFullYear();
    var h = d.getHours();
    $("greeting").textContent = (h < 5 ? "Boa madrugada" : h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite") + (CFG.nome ? ", " + CFG.nome : "");
    if (h === 4 && d.getMinutes() === 0 && d.getSeconds() === 0) location.reload();
  }
  tick(); setInterval(tick, 1000);

  /* ---------- Ícones do clima ---------- */
  var S = 'xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round"';
  var SUN = '<circle cx="32" cy="32" r="11" fill="#ffd27a"/><g stroke="#ffd27a" stroke-width="3"><path d="M32 8v6M32 50v6M8 32h6M50 32h6M15 15l4 4M45 45l4 4M15 49l4-4M45 19l4-4"/></g>';
  var MOON = '<path d="M40 10a20 20 0 1 0 14 30 16 16 0 0 1-14-30z" fill="#eef2fa"/>';
  var CLOUD = '<path d="M20 48h26a10 10 0 0 0 1-20 14 14 0 0 0-27-3 11 11 0 0 0 0 23z" fill="#dfe7f5"/>';
  var CLOUD_DARK = '<path d="M20 48h26a10 10 0 0 0 1-20 14 14 0 0 0-27-3 11 11 0 0 0 0 23z" fill="#aab8d3"/>';
  var SMALL_SUN = '<circle cx="42" cy="20" r="8" fill="#ffd27a"/><g stroke="#ffd27a" stroke-width="2.5"><path d="M42 5v4M42 31v4M27 20h4M53 20h4M31 9l3 3M50 28l3 3M31 31l3-3M50 12l3-3"/></g>';
  var SMALL_MOON = '<path d="M46 8a11 11 0 1 0 8 17 9 9 0 0 1-8-17z" fill="#eef2fa"/>';
  var CLOUD_LOW = '<path d="M18 50h28a9 9 0 0 0 1-18 13 13 0 0 0-25-3 10 10 0 0 0-4 21z" fill="#dfe7f5"/>';
  var RAIN = '<g stroke="#8fd0ff" stroke-width="3"><path d="M24 52v6M32 54v6M40 52v6"/></g>';
  var HEAVY = '<g stroke="#8fd0ff" stroke-width="3"><path d="M20 52v7M28 54v7M36 52v7M44 54v7"/></g>';
  var DRIZZLE = '<g stroke="#8fd0ff" stroke-width="3"><path d="M24 54v1M32 56v1M40 54v1M28 60v1M36 60v1"/></g>';
  var BOLT = '<path d="M34 46l-6 10h6l-3 8 9-12h-6l3-6z" fill="#ffd27a"/>';
  var FOG = '<g stroke="#dfe7f5" stroke-width="3"><path d="M14 52h36M18 58h28"/></g>';
  function icon(code, isDay) {
    var b;
    if (code === 0) b = isDay ? SUN : MOON;
    else if (code === 1 || code === 2) b = (isDay ? SMALL_SUN : SMALL_MOON) + CLOUD_LOW;
    else if (code === 3) b = CLOUD;
    else if (code === 45 || code === 48) b = CLOUD_LOW + FOG;
    else if (code >= 51 && code <= 57) b = CLOUD_LOW + DRIZZLE;
    else if (code === 61 || code === 80 || code === 66) b = CLOUD_LOW + RAIN;
    else if (code === 63 || code === 81 || code === 67) b = CLOUD_DARK + RAIN;
    else if (code === 65 || code === 82) b = CLOUD_DARK + HEAVY;
    else if (code >= 95) b = CLOUD_DARK + BOLT;
    else b = CLOUD;
    return '<svg ' + S + '>' + b + '</svg>';
  }
  function describe(c) {
    if (c === 0) return "Céu limpo"; if (c === 1) return "Predominantemente limpo"; if (c === 2) return "Parcialmente nublado";
    if (c === 3) return "Nublado"; if (c === 45 || c === 48) return "Nevoeiro"; if (c >= 51 && c <= 57) return "Garoa";
    if (c === 61) return "Chuva fraca"; if (c === 63) return "Chuva moderada"; if (c === 65) return "Chuva forte";
    if (c === 66 || c === 67) return "Chuva gelada"; if (c >= 71 && c <= 77) return "Neve"; if (c === 80) return "Pancadas fracas";
    if (c === 81) return "Pancadas de chuva"; if (c === 82) return "Pancadas fortes"; if (c === 95) return "Trovoadas";
    if (c === 96 || c === 99) return "Trovoadas com granizo"; return "Sem dados";
  }

  /* ---------- Clima ---------- */
  var API = "https://api.open-meteo.com/v1/forecast?latitude=-22.9056&longitude=-47.0608"
    + "&current=temperature_2m,apparent_temperature,is_day,weather_code"
    + "&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max"
    + "&timezone=America%2FSao_Paulo&forecast_days=1";
  function xhrJSON(method, url, body, headers, cb) {
    var x = new XMLHttpRequest();
    x.open(method, url, true); x.timeout = 25000;
    if (headers) for (var k in headers) x.setRequestHeader(k, headers[k]);
    x.onload = function () { try { cb(null, x.status, JSON.parse(x.responseText)); } catch (e) { cb(e, x.status, null); } };
    x.onerror = function () { cb(new Error("rede"), 0, null); };
    x.ontimeout = function () { cb(new Error("timeout"), 0, null); };
    x.send(body || null);
  }
  function loadWeather() {
    xhrJSON("GET", API + "&_=" + Date.now(), null, null, function (err, st, d) {
      if (err || st !== 200 || !d) { setTimeout(loadWeather, 2 * 60 * 1000); return; }
      var cur = d.current, dy = d.daily, isDay = cur.is_day === 1;
      $("now-icon").innerHTML = icon(cur.weather_code, isDay);
      $("now-temp").textContent = r(cur.temperature_2m);
      $("now-desc").textContent = describe(cur.weather_code);
      var pp = dy.precipitation_probability_max[0];
      $("now-meta").innerHTML = "Máx <b>" + r(dy.temperature_2m_max[0]) + "°</b> · Mín <b>" + r(dy.temperature_2m_min[0]) + "°</b>"
        + (pp != null ? " · <span class='r'>Chuva " + pp + "%</span>" : "");
    });
  }
  loadWeather(); setInterval(loadWeather, 15 * 60 * 1000);

  /* ---------- Fotos do iCloud ---------- */
  var photos = [], photoIdx = 0, showingA = false, photoTimer = null;
  function b62(s) { var A = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz", n = 0; for (var i = 0; i < s.length; i++) n = n * 62 + A.indexOf(s.charAt(i)); return n; }
  function partitionHost(token) { var n = token.charAt(0) === "A" ? b62(token.charAt(1)) : b62(token.substring(1, 3)); return "p" + (n < 10 ? "0" + n : n) + "-sharedstreams.icloud.com"; }
  function shuffle(a) { for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  function loadAlbum() {
    if (!ALBUM_TOKEN && !ALBUM_PROXY) { return; }
    if (ALBUM_PROXY) {
      xhrJSON("GET", ALBUM_PROXY + (ALBUM_PROXY.indexOf("?") < 0 ? "?" : "&") + "token=" + encodeURIComponent(ALBUM_TOKEN) + "&_=" + Date.now(), null, null, function (err, st, d) {
        if (!err && st === 200 && d && d.urls) gotPhotos(d.urls);
        else setTimeout(loadAlbum, 2 * 60 * 1000);
      });
      return;
    }
    var host = partitionHost(ALBUM_TOKEN);
    function stream(h, tries) {
      xhrJSON("POST", "https://" + h + "/" + ALBUM_TOKEN + "/sharedstreams/webstream", '{"streamCtag":null}', { "Content-Type": "text/plain" }, function (err, st, d) {
        if (st === 330 && d && d["X-Apple-MMe-Host"] && tries < 2) { stream(d["X-Apple-MMe-Host"], tries + 1); return; }
        if (err || st !== 200 || !d || !d.photos) { setTimeout(loadAlbum, 2 * 60 * 1000); return; }
        var guids = [], best = {};
        for (var i = 0; i < d.photos.length; i++) {
          var p = d.photos[i]; if (p.mediaAssetType === "video" || !p.derivatives) continue;
          var bk = null, bw = -1;
          for (var k in p.derivatives) { var w = parseInt(p.derivatives[k].width, 10) || 0; if (w > bw) { bw = w; bk = k; } }
          if (bk) { best[p.derivatives[bk].checksum] = { w: bw, h: parseInt(p.derivatives[bk].height, 10) || 0 }; guids.push(p.photoGuid); }
        }
        xhrJSON("POST", "https://" + h + "/" + ALBUM_TOKEN + "/sharedstreams/webasseturls", JSON.stringify({ photoGuids: guids }), { "Content-Type": "text/plain" }, function (err2, st2, u) {
          if (err2 || st2 !== 200 || !u || !u.items) { setTimeout(loadAlbum, 2 * 60 * 1000); return; }
          var urls = [];
          for (var cs in best) { var it = u.items[cs]; if (it) urls.push({ url: "https://" + it.url_location + it.url_path, w: best[cs].w, h: best[cs].h }); }
          gotPhotos(urls);
        });
      });
    }
    stream(host, 0);
  }
  function gotPhotos(urls) {
    if (!urls.length) return;
    photos = shuffle(urls.slice()); photoIdx = 0;
    $("no-photos").style.display = "none";
    nextPhoto();
    if (photoTimer) clearInterval(photoTimer);
    photoTimer = setInterval(nextPhoto, PHOTO_SECONDS * 1000);
  }
  function nextPhoto() {
    if (!photos.length) return;
    var p = photos[photoIdx % photos.length]; photoIdx++;
    var img = new Image();
    img.onload = function () {
      var slot = $(showingA ? "slot-b" : "slot-a"), other = $(showingA ? "slot-a" : "slot-b");
      var portrait = img.height > img.width * 1.05;
      var pic = slot.children[1];
      /* zera a animação anterior antes de trocar a imagem */
      slot.className = "slot"; pic.style.transitionDuration = "0s"; pic.style.webkitTransitionDuration = "0s";
      slot.children[0].style.backgroundImage = "url('" + p.url + "')";
      pic.style.backgroundImage = "url('" + p.url + "')";
      slot.className = "slot " + (portrait ? "pan" : "zoom") + " show";
      other.className = other.className.replace(" show", "");
      showingA = !showingA;
      setTimeout(function () {
        var dur = (PHOTO_SECONDS + 2) + "s";
        pic.style.transitionDuration = dur; pic.style.webkitTransitionDuration = dur;
        slot.className += " go";
      }, 80);
    };
    img.onerror = function () { setTimeout(nextPhoto, 1500); };
    img.src = p.url;
  }
  loadAlbum();
  setInterval(loadAlbum, 6 * 60 * 60 * 1000); /* os links das fotos expiram: renova a lista de 6 em 6 h */

  /* ---------- Apps ---------- */
  var focus = 0, cards = [];
  function buildApps() {
    var html = "";
    for (var i = 0; i < APP_KEYS.length; i++) {
      var a = CATALOG[APP_KEYS[i]]; if (!a) continue;
      html += '<div class="app" data-key="' + APP_KEYS[i] + '" style="background:' + a.bg + '"><span class="glyph">' + a.glyph + '</span><span class="label">' + a.name + '</span></div>';
    }
    $("apps").innerHTML = html;
    cards = $("apps").children;
    for (var j = 0; j < cards.length; j++) (function (idx) {
      cards[idx].onclick = function () { setFocus(idx); launch(); };
    })(j);
    setFocus(0);
  }
  function setFocus(i) {
    if (!cards.length) return;
    focus = (i + cards.length) % cards.length;
    for (var k = 0; k < cards.length; k++) cards[k].className = "app" + (k === focus ? " focus" : "");
  }
  function toast(msg, ms) { var t = $("toast"); t.textContent = msg; t.className = "toast show"; setTimeout(function () { t.className = "toast"; }, ms || 1800); }
  function launch() {
    var a = CATALOG[cards[focus].getAttribute("data-key")];
    if (window.tizen && tizen.application) {
      toast("Abrindo " + a.name + "…", 4000);
      try {
        tizen.application.launch(a.id, function () {}, function () {
          try { tizen.application.launchAppControl(new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/view"), a.id, null, function () { toast("Não consegui abrir " + a.name); }); }
          catch (e2) { toast("Não consegui abrir " + a.name); }
        });
      } catch (e) { toast("Não consegui abrir " + a.name); }
    } else {
      toast("Na TV isto abriria o " + a.name);
    }
  }
  buildApps();

  document.addEventListener("keydown", function (ev) {
    var k = ev.keyCode;
    if (k === 37) { setFocus(focus - 1); ev.preventDefault(); }
    else if (k === 39) { setFocus(focus + 1); ev.preventDefault(); }
    else if (k === 13) { launch(); ev.preventDefault(); }
    else if (k === 32) { nextPhoto(); }
    else if (k === 10009 || k === 27) { try { tizen.application.getCurrentApplication().exit(); } catch (e) {} }
  });
  try { if (window.tizen && tizen.power) tizen.power.request("SCREEN", "SCREEN_NORMAL"); } catch (e) {}
})();
</script>
</body>
</html>
